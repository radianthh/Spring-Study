spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
  h2:
    console:
      enabled: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  config:
    import: optional:file:.env[.properties]

jwt:
  issuer: black5824@naver.com
  secret_key: ${JWT_SECRET_KEY}